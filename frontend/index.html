<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MissionLMS</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=3"
    >
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <div>
            <h1>MissionLMS</h1>
            <p>Formation par missions</p>
        </div>

        <button
            type="button"
            class="logout-button"
            onclick="Déconnexion()"
        >
            Déconnexion
        </button>

    </header>


    <main class="container">

        <!-- =================================================
             STUDENT
             ================================================= -->

        <section class="student-card">

            <div>
                <h2 id="student-name">
                    Chargement...
                </h2>

                <p id="student-email"></p>
            </div>

        </section>


        <!-- =================================================
             MISSIONS SCREEN
             ================================================= -->

        <div id="missions-screen">

            <section>

                <h2>Mes missions</h2>

                <div id="missions">
                    <p class="loading">
                        Chargement des missions…
                    </p>
                </div>

            </section>

        </div>


        <!-- =================================================
             MISSION SCREEN
             ================================================= -->

        <div
            id="mission-screen"
            style="display: none;"
        >

            <button
                type="button"
                class="back-button"
                onclick="showMissions()"
            >
                ← Retour aux missions
            </button>


            <section class="mission-header">

                <h2 id="mission-title">
                    Mission
                </h2>

                <div id="mission-status"></div>

            </section>


            <!-- =============================================
                 LESSONS
                 ============================================= -->

            <section class="content-section">

                <h2>Contenu pédagogique</h2>

                <div id="lessons">

                    <p class="loading">
                        Chargement des leçons…
                    </p>

                </div>

            </section>


            <!-- =============================================
                 ASSIGNMENTS
                 ============================================= -->

            <section class="content-section">

                <h2>Travail à remettre</h2>

                <div id="assignments">

                    <p class="loading">
                        Chargement du travail…
                    </p>

                </div>

            </section>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/auth.js"></script>

    <script src="js/markdown.js?v=1"></script>

    <script src="js/app.js?v=3"></script>

</body>

</html>
